```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Pass - Crown Quest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<a class="brand" href="index.html">👑 CROWN QUEST</a>
<div class="wallet">👑 <span data-coins>500</span> Crowns</div>
</header>

<nav>
<a href="index.html">Home</a>
<a href="levels.html">Levels</a>
<a href="shop.html">Shop</a>
<a href="collection.html">Collection</a>
<a href="battlepass.html">Battle Pass</a>
<a href="market.html">Market</a>
<a href="leaderboard.html">Leaderboard</a>
</nav>

<main>
<section class="panel">
<h1>🎟️ Crown Battle Pass</h1>
<p>Complete levels to earn XP and claim rewards.</p>
<h2 id="xpText">Your XP: 0</h2>
<div class="progress"><div id="xpBar"></div></div>
</section>

<section id="rewards" class="shopgrid"></section>
</main>

<script src="app.js"></script>
<script>
function renderBattlePass() {
    document.getElementById("xpText").textContent =
        "Your XP: " + gameData.passXP;

    document.getElementById("xpBar").style.width =
        (gameData.passXP % 100) + "%";

    const rewards = document.getElementById("rewards");
    rewards.innerHTML = "";

    for (let tier = 1; tier <= 10; tier++) {
        const needed = tier * 100;
        const rewardId = "battlepass-" + tier;
        const claimed = gameData.history.includes(rewardId);

        const card = document.createElement("article");
        card.className = "panel item";

        card.innerHTML =
            '<div class="art">' + ["🪙","📦","👑","🎁","💎"][tier % 5] + '</div>' +
            '<h2>Tier ' + tier + '</h2>' +
            '<p>Required XP: ' + needed + '</p>' +
            '<p>Reward: 100 Crowns</p>' +
            '<button ' + (gameData.passXP < needed || claimed ? "disabled" : "") + '>' +
            (claimed ? "Claimed" : "Claim Reward") + '</button>';

        card.querySelector("button").addEventListener("click", () => {
            if (gameData.passXP < needed || gameData.history.includes(rewardId)) return;

            gameData.history.push(rewardId);
            addCrowns(100);
            renderBattlePass();
            showMessage("You claimed 100 Crowns!");
        });

        rewards.appendChild(card);
    }
}

document.addEventListener("DOMContentLoaded", renderBattlePass);
</script>
</body>
</html>

```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection - Crown Quest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<a class="brand" href="index.html">👑 CROWN QUEST</a>
<div class="wallet">👑 <span data-coins>500</span> Crowns</div>
</header>

<nav>
<a href="index.html">Home</a>
<a href="levels.html">Levels</a>
<a href="shop.html">Shop</a>
<a href="collection.html">Collection</a>
<a href="battlepass.html">Battle Pass</a>
<a href="market.html">Market</a>
<a href="leaderboard.html">Leaderboard</a>
</nav>

<main>
<section class="panel">
<h1>🎒 Hero Collection</h1>
<p>Collect heroes of different rarities and build your collection.</p>
<div class="stats">
<div class="stat"><span>Unlocked Heroes</span><b id="heroCount">0</b></div>
<div class="stat"><span>Available Heroes</span><b id="totalHeroes">0</b></div>
</div>
<div id="heroGrid" class="shopgrid"></div>
</section>
</main>

<script src="app.js"></script>
<script>
function renderHeroes() {
    const grid = document.getElementById("heroGrid");
    grid.innerHTML = "";

    document.getElementById("heroCount").textContent = gameData.heroes.length;
    document.getElementById("totalHeroes").textContent = HEROES.length;

    HEROES.forEach(hero => {
        const owned = gameData.heroes.includes(hero.id);
        const card = document.createElement("article");
        card.className = "panel item";

        card.innerHTML =
            '<div class="art">' + (owned ? hero.art : "🔒") + '</div>' +
            '<h2>' + (owned ? hero.name : "Locked Hero") + '</h2>' +
            '<span class="badge ' + hero.rarity.toLowerCase() + '">' +
            hero.rarity + '</span>' +
            '<p>' + (owned ? "You own this hero!" : "Open crates to unlock this hero.") +
            '</p>';

        grid.appendChild(card);
    });
}

document.addEventListener("DOMContentLoaded", renderHeroes);
document.addEventListener("crownquest:crate-opened", renderHeroes);
</script>
</body>
</html>
